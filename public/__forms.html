<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Form tanımı</title>
  </head>
  <body>
    <!--
      Bu sayfa hiçbir yere linklenmiyor, ziyaretçiler görmüyor.
      Tek amacı: Netlify'ın deploy sırasında yaptığı statik form taraması
      Next.js'in ürettiği HTML içinde formu bulamıyor, bu yüzden formu
      Next.js'in hiç dokunmadığı /public klasöründe, düz HTML olarak
      burada tutuyoruz. Alanlar EmailPopup'ın gönderdikleriyle birebir
      eşleşmeli.
    -->
    <form name="abone" data-netlify="true" netlify-honeypot="bot-field">
      <input type="email" name="email" />
      <input type="hidden" name="form-name" value="abone" />
      <input name="bot-field" />
    </form>
  </body>
</html>
